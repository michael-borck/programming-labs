<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookable</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#eef1f4; color:#222; padding:24px;}
  .box{width:600px; margin:0 auto; background:#fff; border:1px solid #ccc; padding:20px;}
  h1{font-size:22px; color:#2b6cb0; margin-bottom:2px;}
  .tag{font-size:12px; color:#888; margin-bottom:18px;}
  label{display:block; font-size:12px; color:#666; margin:14px 0 4px; font-weight:700;}
  select,input,textarea{font:inherit; width:100%; border:1px solid #bbb; padding:7px 9px;
    background:#fff;}
  .slots{display:flex; gap:8px; margin-top:4px;}
  .slots button{font:inherit; border:1px solid #bbb; background:#f4f4f4; padding:7px 12px;
    cursor:pointer;}
  .slots button.sel{background:#4a90d9; color:#fff; border-color:#4a90d9;}
  .go{margin-top:18px; font:inherit; background:#9aa5b1; color:#fff; border:none;
    padding:10px 22px; cursor:pointer; font-weight:700;}
  .out{margin-top:16px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px;
    background:#f4f4f4; border:1px solid #ddd; padding:10px; white-space:pre-wrap; display:none;}
  .out.show{display:block;}
  .out.err{color:#c0392b;}
</style>
</head>
<body>
  <div class="box">
    <h1>Bookable</h1>
    <p class="tag">Tutoring session request intake form v0.9</p>

    <label for="subj">SELECT SUBJECT_CODE</label>
    <select id="subj">
      <option value="">--</option>
      <option value="MATH_SEC">MATH_SEC</option>
      <option value="ENG_PRI">ENG_PRI</option>
      <option value="SCI_SEC">SCI_SEC</option>
      <option value="LOTE_FR">LOTE_FR</option>
    </select>

    <label>AVAILABLE TIMESLOTS (24H)</label>
    <div class="slots" id="slots"></div>

    <label for="name">STUDENT_NAME</label>
    <input id="name">

    <label for="email">CONTACT_EMAIL</label>
    <input id="email">

    <label for="notes">NOTES (OPTIONAL)</label>
    <textarea id="notes" rows="2"></textarea>

    <button class="go" id="go" type="button">SUBMIT</button>
    <div class="out" id="out"></div>
  </div>
<script>
"use strict";
var SLOTS = ["1400", "1430", "1500", "1530", "1600"];
var slot = null;
var slotsEl = document.getElementById("slots");
SLOTS.forEach(function (s) {
  var b = document.createElement("button");
  b.type = "button"; b.textContent = s;
  b.addEventListener("click", function () {
    slot = s;
    slotsEl.querySelectorAll("button").forEach(function (x) { x.className = ""; });
    b.className = "sel";
  });
  slotsEl.appendChild(b);
});
document.getElementById("go").addEventListener("click", function () {
  var out = document.getElementById("out");
  var subj = document.getElementById("subj").value;
  var name = document.getElementById("name").value.trim();
  var email = document.getElementById("email").value.trim();
  var notes = document.getElementById("notes").value.trim() || undefined;
  if (!subj) { out.className = "out show err"; out.textContent = "ERROR: subject_code missing"; return; }
  if (!slot) { out.className = "out show err"; out.textContent = "ERROR: slot_id missing"; return; }
  if (!name) { out.className = "out show err"; out.textContent = "ERROR: student_name missing"; return; }
  if (!email || email.indexOf("@") < 0) {
    out.className = "out show err"; out.textContent = "ERROR: contact_email invalid"; return;
  }
  var ref = Math.random().toString(16).slice(2, 6);
  out.className = "out show";
  out.textContent = "SUBMIT OK: true\nref: " + ref + "\nsubject: " + subj + "\nslot: " + slot +
    "\nstudent: " + name + "\nemail: " + email + "\nnotes: " + notes;
});
</script>
</body>
</html>
